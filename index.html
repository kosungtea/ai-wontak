input,select,textarea,button,option{font-family:inherit}
/* 레이아웃: 상단 고정 바(프로젝트·AI 칩) / 대화 목록 / 하단 고정 입력창. 휴대폰은 원문을 탭으로, 넓은 화면은 격자로 */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#e9edf3; --ink:#161c26; --muted:#5d687a; --line:#d8dee8;
  --accent:#2747c9; --accent-ink:#ffffff; --accent-soft:#e3e9fb; --me:#2747c9; --me-ink:#ffffff;
  --ok:#1b7a4b; --warn:#9a5a00; --err:#b3261e; --warn-soft:#fff2d8; --err-soft:#fde7e5;
  --c-claude:#c2683a; --c-gpt:#2c8766; --c-gem:#4862d4; --c-pplx:#1c7d93;
  --code-bg:#eef1f6; --hl-k:#7a3fb0; --hl-s:#1f7a43; --hl-n:#a35200; --hl-c:#7b8494; --hl-t:#1d55b8;
  --f:'Paperlogy',"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#181e27; --sunk:#121821; --ink:#e6eaf1; --muted:#98a3b6; --line:#2a3341;
  --accent:#8199ff; --accent-ink:#0d1324; --accent-soft:#1d2848; --me:#3552d6; --me-ink:#ffffff;
  --ok:#5bd096; --warn:#f0b357; --err:#ff8a80; --warn-soft:#3a2c13; --err-soft:#3d1d1b;
  --c-claude:#e3926a; --c-gpt:#5ac39a; --c-gem:#8c9cff; --c-pplx:#5ab9cf;
  --code-bg:#111720; --hl-k:#c79bff; --hl-s:#7fd49b; --hl-n:#f0b357; --hl-c:#7d8798; --hl-t:#8fb4ff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#181e27; --sunk:#121821; --ink:#e6eaf1; --muted:#98a3b6; --line:#2a3341;
  --accent:#8199ff; --accent-ink:#0d1324; --accent-soft:#1d2848; --me:#3552d6; --me-ink:#ffffff;
  --ok:#5bd096; --warn:#f0b357; --err:#ff8a80; --warn-soft:#3a2c13; --err-soft:#3d1d1b;
  --c-claude:#e3926a; --c-gpt:#5ac39a; --c-gem:#8c9cff; --c-pplx:#5ab9cf;
  --code-bg:#111720; --hl-k:#c79bff; --hl-s:#7fd49b; --hl-n:#f0b357; --hl-c:#7d8798; --hl-t:#8fb4ff;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
body{font-family:var(--f);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{appearance:none;border:0;background:none;color:inherit;cursor:pointer;font:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.svg{width:20px;height:20px;flex:none}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px}
.proj{display:flex;align-items:center;gap:6px;min-width:0;flex:1;padding:6px 8px;border-radius:8px;text-align:left}
.proj:hover{background:var(--sunk)}
.proj .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .ap{font-size:12px;color:var(--muted);white-space:nowrap}
.ib{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--sunk);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;background:var(--bg);max-width:220px}
.chip .mdl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.judge{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dc)}
.web{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;line-height:1.5}

/* 대화 */
main{max-width:1240px;margin:0 auto;padding-block:16px 170px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.banner{font-size:13px;border:1px solid var(--line);background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.banner b{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty h2{color:var(--ink);font-size:19px;margin:0}
.round{display:flex;flex-direction:column;gap:10px}
.me{align-self:flex-end;max-width:min(86%,640px);background:var(--me);color:var(--me-ink);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-break:break-word}
.meta{align-self:flex-end;font-size:11.5px;color:var(--muted);margin-top:-6px}
.bot{display:flex;flex-direction:column;gap:10px;min-width:0}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:520px){.prog{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pg{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0}
.pg .st{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pg.err{border-color:var(--err)}.pg.err .st{color:var(--err)}
.pg.done .st{color:var(--ok)}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;display:flex;flex-direction:column}
.final{border-color:var(--accent)}
.ch{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch .t{font-weight:700;font-size:14px}
.ch .s{font-size:12px;color:var(--muted)}
.ch .sp{flex:1}
.rank{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.rk{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:var(--bg);font-variant-numeric:tabular-nums}
.rk .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sunk)}
.rk.first .n{background:var(--accent);color:var(--accent-ink)}
.rk .sc{color:var(--muted)}
.cb{padding:12px 14px 14px;min-width:0}
.cf{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.pick{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.pick .row{display:flex;gap:6px;flex-wrap:wrap}
details.score{margin:0 14px 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.score summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:700;background:var(--sunk)}
details.score .tw{margin:0;border:0;border-radius:0}

/* 원문: 휴대폰 탭, 넓은 화면 격자 */
.orig-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:10px 10px 8px;font-size:13.5px;border-bottom:2px solid transparent;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--dc);font-weight:700}
.tab .r{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ogrid{display:grid;gap:10px}
.ocard .ch{flex-wrap:nowrap}.ocard .ch .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ocard .clip{max-height:420px;overflow:hidden;position:relative}
.ocard .clip.open{max-height:none}
.ocard .clip:not(.open)::after{content:"";position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(to bottom,transparent,var(--surface))}
.orig{display:flex;flex-direction:column;min-width:0}
@media (max-width:899px){.ogrid .ocard:not(.sel){display:none}}
@media (min-width:900px){.narrow-only{display:none}.ogrid{grid-template-columns:repeat(2,minmax(0,1fr))}.ogrid.n1{grid-template-columns:1fr}}
@media (min-width:1360px){.ogrid.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.ogrid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ofoot{font-size:12px;color:var(--muted);padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.errbox{margin:12px 14px;background:var(--err-soft);border:1px solid var(--err);border-radius:8px;padding:10px 12px;font-size:13px}
.srcs{padding:0 14px 12px;font-size:12.5px}
.srcs ol{margin:4px 0 0;padding-left:20px}
.srcs li{word-break:break-all}

/* 마크다운 */
.md{min-width:0;word-break:break-word;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{font-weight:700;line-height:1.35;margin:1.1em 0 .45em;text-wrap:balance}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4{font-size:1em}
.md p,.md ul,.md ol,.md blockquote{margin:.55em 0}
.md ul,.md ol{padding-left:1.4em}
.md li{margin:.2em 0}
.md blockquote{border-left:3px solid var(--line);padding:2px 12px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md strong{font-weight:700}
.md code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border-radius:4px;padding:1px 5px}
.md pre{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;margin:.7em 0}
.md pre code{background:none;padding:0;font-size:.84em;line-height:1.55;white-space:pre}
.md .cl{position:absolute;top:6px;right:6px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.tw{overflow-x:auto;margin:.7em 0;border:1px solid var(--line);border-radius:8px}
.md table,.tw table{border-collapse:collapse;width:100%;font-size:.92em;font-variant-numeric:tabular-nums}
.md th,.md td,.tw th,.tw td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th,.tw th{background:var(--sunk);font-weight:700;white-space:nowrap}
.md tr:last-child td,.tw tr:last-child td{border-bottom:0}
.md img{max-width:100%;border-radius:8px}
.md .math.disp{display:block;overflow-x:auto;text-align:center;margin:.6em 0}
.md .math svg{max-width:100%}
.md sup.cite a,.src{font-size:10.5px;font-weight:700;text-decoration:none;border-radius:4px;padding:0 4px;margin:0 1px;vertical-align:1px}
.md sup.cite a{background:var(--accent-soft);color:var(--accent)}
.src{display:inline-block;border:1px solid var(--dc);color:var(--dc);line-height:1.5}
.viz{border:1px solid var(--line);border-radius:10px;margin:.7em 0;overflow:hidden;background:var(--surface)}
.viz .vh{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--sunk)}
.viz .vh .sp{flex:1}
.viz .vh button{font-size:11.5px;color:var(--accent)}
.viz .mm{padding:10px;overflow-x:auto;display:flex;justify-content:center}
.viz .mm svg{max-width:100%;height:auto}
.viz iframe{display:block;width:100%;border:0;height:320px;background:#ffffff}
.viz pre{margin:0;border:0;border-radius:0}
.hljs-keyword,.hljs-built_in,.hljs-selector-tag{color:var(--hl-k)}
.hljs-string,.hljs-attr,.hljs-symbol{color:var(--hl-s)}
.hljs-number,.hljs-literal{color:var(--hl-n)}
.hljs-comment,.hljs-quote{color:var(--hl-c);font-style:italic}
.hljs-title,.hljs-name,.hljs-type,.hljs-tag{color:var(--hl-t)}
.caret::after{content:"";display:inline-block;width:7px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* 입력창 */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to bottom,transparent,var(--bg) 22px);padding-top:20px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.comp-in{max-width:840px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.box{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px;box-shadow:0 4px 18px rgba(20,30,50,.08)}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;background:transparent;color:var(--ink);resize:none;font-size:16px;line-height:1.5;max-height:160px;padding:7px 0;outline:none;min-width:0}
.send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.hintline{font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:84vh}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 18px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-size:16px;font-weight:700;flex:1}
.sh-b{overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>label,.lbl{font-size:13px;font-weight:700}
.fl .hint,.hint{font-size:12px;color:var(--muted);font-weight:400}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:16px}
textarea.in{resize:vertical;min-height:80px;line-height:1.55}
.tg{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer}
.tg input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow-y:auto}
.mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--sunk)}
.mi[aria-checked="true"]{background:var(--accent-soft)}
.mi .mn{font-weight:700;font-size:13.5px}
.mi .mid{font-size:11.5px;color:var(--muted);word-break:break-all}
.mi .pr{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--bg)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px}
.pi{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pi[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pi .pn{flex:1;min-width:0;text-align:left}
.pi .pn b{display:block}
.pi .pn span{font-size:12px;color:var(--muted)}
.okmsg{font-size:12.5px;color:var(--ok);min-height:1.2em}
.errmsg{font-size:12.5px;color:var(--err)}

/* 전체 화면 원문 */
.reader{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader .rh{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
.reader .rh .tabs{flex:1;border:0}
.reader .rb{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.reader .rb .md{max-width:760px;margin:0 auto}
.reader .rtool{max-width:760px;margin:0 auto 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.raw{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-width:760px;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;z-index:60}
@media (prefers-reduced-motion:reduce){.spin,.caret::after{animation:none}}
</style>

</head>
<body>

        <span class="ap">AI 원탁</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script>
(function(){
'use strict';
const API='https://openrouter.ai/api/v1';
const PROV=[
  {id:'claude',name:'Claude',pfx:['anthropic/'],c:'var(--c-claude)'},
  {id:'gpt',name:'ChatGPT',pfx:['openai/'],c:'var(--c-gpt)'},
  {id:'gem',name:'Gemini',pfx:['google/gemini'],c:'var(--c-gem)'},
  {id:'pplx',name:'Perplexity',pfx:['perplexity/'],c:'var(--c-pplx)'}
];
const PV=Object.fromEntries(PROV.map(p=>[p.id,p]));
const LET='ABCD';
const KEY='ai-wontak-v1', MKEY='ai-wontak-models';
const CRIT_ALL=['정확성','근거','누락 없음','실행 가능성','간결성'];
const VIS=[
 '답에 시각 자료가 도움이 되면 아래 형식만 씁니다. 화면이 이 형식을 그대로 그려 줍니다.',
 '- 표: 마크다운 표',
 '- 흐름도·구조도·일정표: ```mermaid 코드 블록',
 '- 차트·그림·인터랙티브 화면: ```html 코드 블록(완성된 HTML 한 덩어리, 라이브러리는 cdnjs.cloudflare.com에서 불러옴) 또는 ```svg 코드 블록',
 '- 수식: $$ … $$',
 '외부 이미지 주소나 이미지 파일 링크는 쓰지 않습니다.'
].join('\n');
const MASK=/(Claude|클로드|ChatGPT|Chat\s?GPT|챗\s?GPT|챗지피티|GPT-?[0-9][\w.\-]*|OpenAI|Anthropic|Perplexity|퍼플렉시티|Gemini|제미나이|제미니|Bard)/gi;
const PREF={claude:[/claude-sonnet/,/claude-opus/],gpt:[/^openai\/gpt-\d[\d.]*$/,/^openai\/gpt-\d/],gem:[/gemini-[\d.]+-pro$/,/gemini.*pro/],pplx:[/^perplexity\/sonar-pro$/,/sonar/]};
const BAD=/mini|nano|lite|audio|image|tts|realtime|codex|oss|embed|free|vision|instruct|deep-research|search-preview/i;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const shortName=id=>id?String(id).split('/').pop():'';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function h(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='style')e.style.cssText=attrs[k];else if(k.startsWith('on'))e[k]=attrs[k];else e.setAttribute(k,attrs[k])}if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let toastT;function toast(msg){let t=document.querySelector('.toast');if(!t){t=h('div',{class:'toast',role:'status'});document.body.append(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('복사했습니다')}catch(e){toast('복사가 막혔습니다. 길게 눌러 직접 복사합니다')}}

/* ---------- 상태 ---------- */
function newProject(name){return {id:uid(),name:name||'새 프로젝트',shared:'',per:{claude:'',gpt:'',gem:'',pplx:'',judge:''},ref:'',rounds:[],created:Date.now()}}
let S={v:1,key:'',sel:{claude:{model:'',on:true,web:false},gpt:{model:'',on:true,web:false},gem:{model:'',on:true,web:false},pplx:{model:'',on:true,web:false}},
  judge:{prov:'claude',model:''},auto:true,crit:['정확성','근거','누락 없음','실행 가능성'],extraCrit:'',visual:true,mask:true,rate:1400,ctx:4,theme:'system',projects:[],cur:''};
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(d&&d.projects&&d.projects.length){S=Object.assign(S,d);PROV.forEach(p=>{S.sel[p.id]=Object.assign({model:'',on:true,web:false},S.sel[p.id]||{})})}
  else{const P=demoProject();S.projects=[newProject('기본 프로젝트'),P];S.cur=P.id}
  if(!S.projects.find(p=>p.id===S.cur))S.cur=S.projects[0].id;
  S.projects.forEach(p=>p.rounds.forEach(r=>{Object.values(r.answers).forEach(a=>{if(a.status==='stream'){a.status=a.text?'done':'error';if(!a.text)a.err='앱이 닫혀 답을 받지 못했습니다.'}});if(r.judge&&r.judge.status==='stream'){r.judge.status='error';r.judge.err='앱이 닫혀 정리를 마치지 못했습니다.'}}));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족합니다. 오래된 대화를 지웁니다')}}
const cur=()=>S.projects.find(p=>p.id===S.cur);
function applyTheme(){const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.dataset.theme=S.theme;else delete r.dataset.theme;initMermaid()}
function isDark(){return S.theme==='dark'||(S.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)}

/* ---------- 모델 목록 ---------- */
let MODELS=[],modelsState='idle';
function provModels(pid){return MODELS.filter(m=>PV[pid].pfx.some(x=>m.id.startsWith(x))).sort((a,b)=>(b.created||0)-(a.created||0))}
function pickDefault(pid){const ms=provModels(pid).filter(m=>!BAD.test(m.id));for(const rx of PREF[pid]){const f=ms.find(m=>rx.test(m.id));if(f)return f.id}return ms[0]?ms[0].id:''}
function ensureDefaults(){let ch=false;PROV.forEach(p=>{const s=S.sel[p.id];if(!s.model||(MODELS.length&&!MODELS.find(m=>m.id===s.model))){const d=pickDefault(p.id);if(d&&d!==s.model){s.model=d;ch=true}}});if(!S.judge.model||(MODELS.length&&!MODELS.find(m=>m.id===S.judge.model))){const d=S.sel[S.judge.prov].model;if(d){S.judge.model=d;ch=true}}if(ch)save()}
async function loadModels(force){
  try{const c=JSON.parse(localStorage.getItem(MKEY)||'null');if(c&&!force&&Date.now()-c.t<12*3600e3&&c.data.length){MODELS=c.data;modelsState='ok';ensureDefaults();renderChips();return}}catch(e){}
  modelsState='loading';
  try{const r=await fetch(API+'/models');if(!r.ok)throw new Error(r.status);const j=await r.json();
    MODELS=(j.data||[]).filter(m=>PROV.some(p=>p.pfx.some(x=>m.id.startsWith(x)))).map(m=>({id:m.id,name:m.name||m.id,created:m.created||0,pin:+(m.pricing&&m.pricing.prompt||0)*1e6,pout:+(m.pricing&&m.pricing.completion||0)*1e6,ctx:m.context_length||0}));
    modelsState='ok';try{localStorage.setItem(MKEY,JSON.stringify({t:Date.now(),data:MODELS}))}catch(e){}
  }catch(e){modelsState='fail'}
  ensureDefaults();renderChips();
}
const price=m=>m&&(m.pin||m.pout)?`$${fmtP(m.pin)} / $${fmtP(m.pout)}`:'';
const fmtP=v=>v>=10?v.toFixed(0):v>=1?v.toFixed(1):v.toFixed(2);

/* ---------- 예시 프로젝트 ---------- */
function demoProject(){
  const P=newProject('예시 프로젝트');P.demo=true;
  const ans={
   claude:'요구사항 변경은 **접수 → 영향 분석 → 승인 → 반영 → 확인** 다섯 단계로 처리합니다.\n\n| 단계 | 담당 | 산출물 |\n|---|---|---|\n| 접수 | 발주기관 담당자 | 변경요청서 |\n| 영향 분석 | PM·PL | 영향분석서(일정·공수·비용) |\n| 승인 | 변경통제위원회 | 회의록, 승인 결과 |\n| 반영 | 개발팀 | 요구사항정의서·추적표 개정 |\n| 확인 | 품질 담당 | 변경 이력 대장 |\n\n### 실무 요령\n- 구두 요청도 변경요청서로 받습니다.\n- 과업 범위 밖이면 영향분석서에 **추가 공수**를 숫자로 적습니다.\n- 승인 전에는 개발에 들어가지 않습니다.',
   gpt:'핵심은 **승인 전에 손대지 않는 것**입니다. 흐름은 아래와 같습니다.\n\n```mermaid\nflowchart TD\n  A[변경 요청 접수] --> B{과업 범위 안?}\n  B -- 예 --> C[영향 분석]\n  B -- 아니오 --> D[추가 과업 협의]\n  C --> E[변경통제위원회 승인]\n  D --> E\n  E -- 승인 --> F[설계·개발 반영]\n  E -- 반려 --> G[요청자에게 사유 회신]\n  F --> H[추적표·이력 갱신]\n```\n\n1. 요청은 문서로만 받습니다.\n2. 영향 분석에는 일정, 공수, 위험을 함께 적습니다.\n3. 반영 뒤 요구사항 추적표를 갱신해 감리에 대비합니다.',
   gem:'변경 요청이 많으면 **영향도 점수**로 순서를 정하면 편합니다. 예시 점수는 아래와 같습니다.\n\n```html\n<canvas id="c" height="200"></canvas>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>\n<script>\nnew Chart(document.getElementById("c"),{type:"bar",data:{labels:["화면 문구 수정","검색 조건 추가","외부 연계 변경","권한 체계 변경"],datasets:[{label:"영향도(10점)",data:[2,4,8,9],backgroundColor:["#7fb3a3","#7fa3d6","#e0a36b","#d97a6c"]}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{max:10}}}});\n<\/script>\n```\n\n점수 7 이상은 변경통제위원회 안건으로 올리고, 3 이하는 PM 선에서 처리합니다.',
   pplx:'공공 SW 사업의 과업 변경은 계약 문서와 발주기관 절차를 따릅니다[1]. 보통 변경 요청 접수, 영향 분석, 협의·승인, 계약 변경 순서로 진행합니다[2].\n\n- 과업이 바뀌어 비용이 늘면 계약 금액 조정 대상이 될 수 있습니다[1].\n- 변경 내역은 산출물과 이력으로 남겨 감리 때 확인받습니다[2].'
  };
  const models={claude:'anthropic/claude-sonnet',gpt:'openai/gpt',gem:'google/gemini-pro',pplx:'perplexity/sonar-pro'};
  const r={id:uid(),demo:true,q:'공공 SI 프로젝트에서 요구사항 변경 요청이 들어오면 어떤 절차로 처리하나?',at:Date.now()-3600e3,answers:{},order:['gpt','pplx','claude','gem']};
  PROV.forEach(p=>{r.answers[p.id]={model:models[p.id],web:false,text:ans[p.id],cites:p.id==='pplx'?[{url:'https://example.com/sample-source-1',title:'예시 출처 1'},{url:'https://example.com/sample-source-2',title:'예시 출처 2'}]:[],status:'done',cost:0.012}});
  r.jorder=r.order.slice();
  const js={ranking:[
    {id:'C',total:4.5,scores:{'정확성':5,'근거':4,'누락 없음':5,'실행 가능성':4},reason:'단계·담당·산출물을 한 표로 정리했습니다.'},
    {id:'A',total:4.3,scores:{'정확성':5,'근거':4,'누락 없음':4,'실행 가능성':4},reason:'범위 밖 요청의 분기를 흐름도로 보였습니다.'},
    {id:'D',total:3.8,scores:{'정확성':4,'근거':3,'누락 없음':3,'실행 가능성':5},reason:'우선순위 기준을 수치로 제시했으나 근거가 없습니다.'},
    {id:'B',total:3.5,scores:{'정확성':4,'근거':4,'누락 없음':3,'실행 가능성':3},reason:'계약 변경 관점은 좋으나 실무 절차가 짧습니다.'}],
    issues:[{id:'D',text:'영향도 7점 이상을 위원회 안건으로 올리는 기준은 근거 없이 제시되었습니다.'}]};

  s=s.replace(/(^|\n)(```|~~~)[^\n]*\n[\s\S]*?(?:\n\2[ \t]*(?=\n|$)|$)/g,hold);

  if(s===401)return '키가 맞지 않습니다. 설정에서 OpenRouter 키를 확인합니다.';
  if(s===402)return '크레딧이 부족합니다. OpenRouter에서 충전합니다.';
  if(s===429)return '요청이 많습니다. 잠시 뒤 다시 시도합니다.';
  if(s===403)return '이 모델 사용이 막혔습니다. '+m;

  return m||'알 수 없는 오류가 났습니다.';

async function stream(body,signal,cb){
  const res=await fetch(API+'/chat/completions',{method:'POST',signal,headers:{'Authorization':'Bearer '+S.key,'Content-Type':'application/json','X-Title':'AI Wontak'},body:JSON.stringify(Object.assign({stream:true,usage:{include:true}},body))});
  if(!res.ok){let m='';try{const j=await res.json();m=(j.error&&j.error.message)||''}catch(e){}const er=new Error(m);er.status=res.status;throw er}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')return;
      let j;try{j=JSON.parse(d)}catch(e){continue}
      if(j.error){const er=new Error(j.error.message||'');er.status=j.error.code;throw er}
      const ch=j.choices&&j.choices[0];const dl=ch&&(ch.delta||ch.message);
      if(dl&&dl.content)cb.text(dl.content);
      const anns=(dl&&dl.annotations)||[];anns.forEach(x=>{const u=x.url_citation||x;if(u&&u.url)cb.cites([{url:u.url,title:u.title||''}],false)});
      if(Array.isArray(j.citations)&&j.citations.length)cb.cites(j.citations.map(u=>typeof u==='string'?{url:u,title:''}:u),true);
      if(j.usage)cb.usage(j.usage);
    }}
}
function buildSystem(P,pid){const parts=[];if(S.visual&&pid!=='judge')parts.push(VIS);if(P.shared.trim())parts.push(P.shared.trim());if((P.per[pid]||'').trim())parts.push(P.per[pid].trim());if(P.ref.trim())parts.push('[참고 자료]\n'+P.ref.trim());return parts.join('\n\n')}
function messagesFor(P,pid,r){
  const msgs=[];const sys=buildSystem(P,pid);if(sys)msgs.push({role:'system',content:sys});
  const prev=P.rounds.filter(x=>x!==r&&x.at<r.at&&!x.demo&&x.answers[pid]&&x.answers[pid].status==='done').slice(-S.ctx);
  if(S.ctx>0)prev.forEach(x=>{msgs.push({role:'user',content:x.q});msgs.push({role:'assistant',content:x.answers[pid].text})});

}
async function ask(r,pid){

      text:t=>{a.text+=t;tick(r)},
      cites:(list,replace)=>{if(replace&&list.length>=a.cites.length)a.cites=list;else list.forEach(c=>{if(!a.cites.find(x=>x.url===c.url))a.cites.push(c)})},

    const row=h('div',{class:'bar'});const sv=h('button',{class:'btn pri',type:'button'},'저장');const ck=h('button',{class:'btn',type:'button'},'잔액 확인');row.append(sv,ck);

    sv.onclick=()=>{S.key=ki.value.trim();save();renderChips();renderChat();msg.className='okmsg';msg.textContent=S.key?'저장했습니다.':'키를 지웠습니다.'};
    ck.onclick=async()=>{const k=ki.value.trim();if(!k){msg.className='errmsg';msg.textContent='키를 먼저 넣습니다.';return}msg.className='okmsg';msg.textContent='확인 중…';
      try{const res=await fetch(API+'/credits',{headers:{Authorization:'Bearer '+k}});if(!res.ok){const e=new Error();e.status=res.status;throw e}const j=await res.json();const d=j.data||{};const left=(+d.total_credits||0)-(+d.total_usage||0);msg.textContent=`남은 크레딧 $${left.toFixed(2)} (약 ${won(left)}원). 지금까지 쓴 금액 $${(+d.total_usage||0).toFixed(2)}`}
      catch(e){msg.className='errmsg';msg.textContent=errMsg(e)}};
    kf.append(ki,row,msg,h('div',{class:'hint'},'키는 openrouter.ai의 Keys 메뉴에서 만듭니다. 이 기기 브라우저에만 저장되고 OpenRouter 외 다른 곳으로 보내지 않습니다.'));
    b.append(kf);
    b.append(tgl('시각 자료 형식 지침 보내기','표·mermaid·HTML 차트로 답하도록 각 AI에 알립니다. 끄면 각 AI의 기본 답에 더 가깝지만 그림이 글로만 나올 수 있습니다.',S.visual,v=>{S.visual=v;save()}));
    b.append(tgl('심사 때 답 안의 AI 이름 가리기','질문이 이 AI들 자체에 관한 것이면 끕니다.',S.mask,v=>{S.mask=v;save()}));
    const cf=h('div',{class:'fl'});cf.append(h('label',{for:'ctxIn'},'이전 대화 기억'));const cs=h('select',{class:'in',id:'ctxIn'});[[0,'기억하지 않음'],[2,'최근 2번'],[4,'최근 4번'],[8,'최근 8번']].forEach(([v,t])=>cs.append(h('option',{value:v},t)));cs.value=String(S.ctx);cs.onchange=()=>{S.ctx=+cs.value;save()};cf.append(cs,h('div',{class:'hint'},'각 AI는 같은 프로젝트의 자기 답만 기억합니다. 많이 기억할수록 비용이 늘어납니다.'));b.append(cf);
    const th=h('div',{class:'fl'});th.append(h('span',{class:'lbl'},'화면'));const seg=h('div',{class:'seg'});[['system','기기 설정'],['light','밝게'],['dark','어둡게']].forEach(([v,t])=>{const bt=h('button',{type:'button','aria-pressed':String(S.theme===v)},t);bt.onclick=()=>{S.theme=v;save();applyTheme();seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===bt)));renderChat()};seg.append(bt)});th.append(seg);b.append(th);
    const rf=h('div',{class:'fl'});rf.append(h('label',{for:'rateIn'},'환율(원/달러)'));const ri=h('input',{class:'in',type:'number',id:'rateIn',inputmode:'numeric'});ri.value=S.rate;ri.onchange=()=>{S.rate=+ri.value||1400;save()};rf.append(ri);b.append(rf);
    const df=h('div',{class:'fl'});df.append(h('span',{class:'lbl'},'이 프로젝트 대화'));const del=h('button',{class:'btn',type:'button'},'대화 기록 지우기');
    del.onclick=()=>{if(del.dataset.arm!=='1'){del.dataset.arm='1';del.textContent='한 번 더 누르면 지웁니다';setTimeout(()=>{del.dataset.arm='';del.textContent='대화 기록 지우기'},3000);return}cur().rounds=[];save();renderChat();closeSheet();toast('대화를 지웠습니다')};
    df.append(del,h('div',{class:'hint'},'키와 대화는 이 기기 브라우저에만 저장됩니다. PC와 휴대폰은 기록이 따로 쌓입니다.'));b.append(df);
  });
}
function openProjects(){
  sheet('프로젝트',b=>{
    const list=h('div',{class:'plist'});
    S.projects.forEach(P=>{const it=h('div',{class:'pi','aria-current':String(P.id===S.cur)});
      const nm=h('button',{class:'pn',type:'button'},`<b>${esc(P.name)}</b><span>대화 ${P.rounds.length}개${P.demo?' · 예시':''}${hasInstr(P)?' · 지침 있음':''}</span>`);
      nm.onclick=()=>{S.cur=P.id;save();closeSheet();renderChips();renderChat();scrollToEnd()};
      const ed=h('button',{class:'btn',type:'button'},'설정');ed.onclick=()=>openProjectEdit(P);
      it.append(nm);if(!P.demo)it.append(ed);list.append(it)});
    const nb=h('button',{class:'btn pri',type:'button'},'새 프로젝트');nb.onclick=()=>{const P=newProject('새 프로젝트');S.projects.unshift(P);S.cur=P.id;save();renderChips();renderChat();openProjectEdit(P)};
    b.append(nb,list,h('div',{class:'hint'},'프로젝트마다 AI별 지침과 참고 자료를 따로 둡니다. 대화 기록도 프로젝트별로 쌓입니다.'));
  });
}
const hasInstr=P=>!!(P.shared.trim()||P.ref.trim()||Object.values(P.per).some(v=>v.trim()));
function openProjectEdit(P){
  sheet('프로젝트 설정',b=>{
    const f=(label,hint,val,on,rows,id)=>{const w=h('div',{class:'fl'});w.append(h('label',{for:id},esc(label)));const t=rows?h('textarea',{class:'in',rows,id}):h('input',{class:'in',type:'text',id});t.value=val;t.oninput=()=>on(t.value);if(hint)w.append(h('div',{class:'hint'},esc(hint)));w.append(t);return w};
    b.append(f('이름',null,P.name,v=>{P.name=v||'이름 없음';save();renderChips()},0,'pjName'));
    b.append(f('공통 지침','모든 AI와 정리 AI에 함께 보냅니다.',P.shared,v=>{P.shared=v;save()},3,'pjShared'));
    PROV.forEach(p=>b.append(f(p.name+' 지침',`${p.name} 프로젝트(또는 Gem·Space)의 지침을 복사해 붙입니다.`,P.per[p.id],v=>{P.per[p.id]=v;save()},3,'pj-'+p.id)));
    b.append(f('정리 AI 지침','심사·정리 때만 보냅니다. 예: 결론은 공공기관 보고서 문체로 씁니다.',P.per.judge,v=>{P.per.judge=v;save()},3,'pjJudge'));
    const rw=f('참고 자료','모든 AI에 함께 보냅니다. 프로젝트 파일 내용을 텍스트로 붙입니다. 길수록 질문마다 비용이 늘어납니다.',P.ref,v=>{P.ref=v;cnt.textContent=v.length.toLocaleString()+'자';save()},6,'pjRef');const cnt=h('div',{class:'hint'},P.ref.length.toLocaleString()+'자');rw.append(cnt);b.append(rw);
    const row=h('div',{class:'bar'});const done=h('button',{class:'btn pri',type:'button'},'완료');done.onclick=()=>{closeSheet();renderChips();renderChat()};
    const del=h('button',{class:'btn',type:'button'},'프로젝트 지우기');
    del.onclick=()=>{if(S.projects.filter(x=>!x.demo).length<=1&&!P.demo)return toast('프로젝트가 하나 이상 있어야 합니다');if(del.dataset.arm!=='1'){del.dataset.arm='1';del.textContent='한 번 더 누르면 지웁니다';setTimeout(()=>{del.dataset.arm='';del.textContent='프로젝트 지우기'},3000);return}
      S.projects=S.projects.filter(x=>x!==P);if(S.cur===P.id)S.cur=S.projects[0].id;save();closeSheet();renderChips();renderChat()};
    row.append(done,del);b.append(row);
  });
}

/* ---------- 전체 화면 원문 ---------- */
function openReader(r,start){
  closeReader();const keys=[];if(r.judge&&parseJudge(r.judge.raw).final)keys.push('final');answered(r).forEach(pid=>{if(r.answers[pid].text)keys.push(pid)});
  if(!keys.length)return;let k=keys.includes(start)?start:keys[0];let raw=false;
  const rd=h('div',{class:'reader',id:'reader',role:'dialog','aria-modal':'true','aria-label':'답 전체 보기'});
  const hd=h('div',{class:'rh'});const tabs=h('div',{class:'tabs',role:'tablist'});
  const x=h('button',{class:'ib',type:'button','aria-label':'닫기'},'<svg class="svg" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>');x.onclick=closeReader;
  hd.append(tabs,x);const body=h('div',{class:'rb'});rd.append(hd,body);document.body.append(rd);document.body.style.overflow='hidden';
  const textOf=key=>key==='final'?parseJudge(r.judge.raw).final:r.answers[key].text;
  const draw=()=>{tabs.innerHTML='';keys.forEach(key=>{const p=key==='final'?PV[r.judge.prov]:PV[key];const t=h('button',{class:'tab',role:'tab',style:`--dc:${p.c}`,'aria-selected':String(key===k)},`<span class="dot"></span>${key==='final'?'정리':p.name}`);t.onclick=()=>{k=key;raw=false;draw()};tabs.append(t)});
    body.innerHTML='';body.scrollTop=0;const tool=h('div',{class:'rtool'});
    const model=key=>key==='final'?r.judge.model:r.answers[key].model;
    tool.append(h('span',null,esc(shortName(model(k)))));const sp=h('span',{style:'flex:1'});
    const rb=h('button',{class:'btn',type:'button'},raw?'화면으로 보기':'원문(마크다운) 보기');rb.onclick=()=>{raw=!raw;draw()};
    const cp=h('button',{class:'btn',type:'button'},'복사');cp.onclick=()=>copyText(textOf(k));tool.append(sp,rb,cp);body.append(tool);
    if(raw)body.append(h('div',{class:'raw'},esc(textOf(k))));
    else body.append(renderMD(textOf(k),k==='final'?{refs:letterMap(r)}:{cites:r.answers[k].cites}));
    if(k!=='final'&&r.answers[k].cites&&r.answers[k].cites.length)body.append(h('div',{class:'srcs',style:'max-width:760px;margin:12px auto 0;padding:0'},'<b>출처</b><ol>'+r.answers[k].cites.map(c=>`<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title||c.url)}</a></li>`).join('')+'</ol>'));
    const sel=tabs.querySelector('[aria-selected="true"]');if(sel)sel.scrollIntoView({block:'nearest',inline:'center'})};
  draw();
  let sx=0,sy=0;body.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  body.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){if(e.target.closest('.tw,pre,.viz'))return;const i=keys.indexOf(k)+(dx<0?1:-1);if(i>=0&&i<keys.length){k=keys[i];raw=false;draw()}}},{passive:true});
}
function closeReader(){const r=$('reader');if(r){r.remove();document.body.style.overflow=''}}
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('reader'))closeReader();else closeSheet()}});

/* ---------- 입력창 ---------- */
function autosize(){const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
function scrollToEnd(){scrollTo({top:document.body.scrollHeight})}

load();applyTheme();renderChips();renderChat();setSend();
$('input').addEventListener('input',autosize);
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}});
$('sendBtn').onclick=send;$('setBtn').onclick=openSettings;$('projBtn').onclick=openProjects;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system'){initMermaid();renderChat()}});
loadModels(false);
setTimeout(scrollToEnd,60);
})();
